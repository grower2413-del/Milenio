        function renderizarVOD(peliculas) {
            const contenedor = document.getElementById('vod-grid');
            contenedor.innerHTML = "";

            if (peliculas.length === 0) {
                contenedor.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #94a3b8;'>No se encontraron películas.</p>";
                return;
            }

            peliculas.forEach(pelicula => {
                const card = document.createElement('div');
                card.className = 'vod-card';
                card.onclick = () => reproducirPelicula(pelicula.url, pelicula.titulo);

                card.innerHTML = `
                    <img src="${pelicula.poster}" alt="${pelicula.titulo}" class="vod-poster" onerror="this.src='https://via.placeholder.com/180x260?text=Sin+Poster'">
                    <div class="vod-info">
                        <div class="vod-title">${pelicula.titulo}</div>
                        <div class="vod-meta">
                            <span class="vod-genre">${pelicula.genero}</span>
                            <span class="vod-badge">${pelicula.calidad}</span>
                        </div>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function filtrarPeliculas() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const genre = document.getElementById('genreSelect').value;

            const filtradas = listaPeliculasVOD.filter(p => {
                const matchTitle = p.titulo.toLowerCase().includes(query);
                const matchGenre = genre === "" || p.genero === genre;
                return matchTitle && matchGenre;
            });

            renderizarVOD(filtradas);
        }

        function reproducirPelicula(url, titulo) {
            console.log(`Reproduciendo: ${titulo} -> URL: ${url}`);
            alert(`Cargando reproductor para: ${titulo}`);
        }

        // Inicializar
        window.onload = () => renderizarVOD(listaPeliculasVOD);
    </script>
</body>
</html>
