<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Wings TV v2 - GLYSTV+</title>
    <style>
        :root { 
            --accent: #00a8e1; /* Azul Super Wings */
            --bg: #000; 
            --card: #111; /* Fondo tarjeta oscuro como Larva */
            --text: #fff; 
        }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            text-align: center; 
            overflow-x: hidden;
        }

        /* Reproductor Fijo Superior */
        .video-box { 
            position: sticky; 
            top: 0; 
            background: #000; 
            z-index: 1000; 
            border-bottom: 3px solid var(--accent); 
            padding-bottom: 10px; 
        }
        
        #video-container { 
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto; 
            background: #000; 
        }
        
        video { 
            width: 100%; 
            aspect-ratio: 16/9; 
            display: block; 
        }
        
        /* Título del video actual (Estilo Larva) */
        .current-title { 
            padding: 10px; 
            color: #f5c518; /* Amarillo dorado */
            font-size: 14px; 
            font-weight: bold; 
            text-transform: uppercase;
        }
        
        /* Botón Atrás (Estilo Larva) */
        .btn-atras { 
            background: #e50914; /* Rojo */
            color: white; 
            padding: 8px 15px; 
            border-radius: 4px; 
            text-decoration: none; 
            display: inline-block; 
            margin: 10px; 
            font-weight: bold; 
            font-size: 13px; 
        }

        /* Rejilla de Capítulos (Estilo Larva - Rejilla moderna) */
        .grid-superwings { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
            padding: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        /* Tarjeta de Video (Estilo Larva) */
        .video-card { 
            background: var(--card); 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #333; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        
        /* Efecto al tocar la tarjeta (Borde azul) */
        .video-card:active { 
            transform: scale(0.95); 
            border-color: var(--accent); 
        }
        
        /* Marcador de posición del icono (Avión) */
        .thumb-placeholder { 
            height: 90px; 
            background: #222; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 40px; 
            color: var(--accent); 
        }
        
        /* Información del capítulo */
        .video-info { 
            padding: 8px; 
            color: #fff; 
            font-size: 10px; 
            text-align: center; 
            text-transform: uppercase; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="video-box">
    <div id="video-container"></div>
    <div id="displayTitle" class="current-title">Toca un episodio para iniciar</div>
    <a href="index.html" class="btn-atras">⬅ VOLVER AL MENÚ</a>
</div>

<div class="grid-superwings" id="superwingsGrid"></div>

<script>
    // LISTA DE EPISODIOS CON ENLACES DROPBOX ( raw=1 )
    const videos = [
        {t:"Episodios 01 - 03", u:"https://www.dropbox.com/scl/fi/ejns0qfkf7p2t6twnbiii/Recopilaci-n-de-SUPERWINGS1-EP01_03-_-Superwings-en-Espa-ol-Latino-_-Super-Wings-720P_HD.mp4?rlkey=tek5tba221p2lz7ccutxeyw0v&raw=1"},
        {t:"Episodios 04 - 06", u:"https://www.dropbox.com/scl/fi/j6byme90d0qz7mtyzctg7/Recopilaci-n-de-SUPERWINGS1-EP04_06-_-Superwings-en-Espa-ol-Latino-_-Super-Wings-720P_HD.mp4?rlkey=965lwvjpvqlfutkwy41qhs2r3&raw=1"},
        {t:"Episodios 07 - 09", u:"https://www.dropbox.com/scl/fi/kpdqn1abza1zg1uci15yq/Recopilaci-n-de-SUPERWINGS1-EP07_09-_-Superwings-en-Espa-ol-Latino-_-Super-Wings-720P_HD.mp4?rlkey=1rum4p5aoy0ri7jcoly7v86zo&raw=1"},
        {t:"Episodios 10 - 12", u:"https://www.dropbox.com/scl/fi/byfdk5uo4xs3o23t00o3i/Recopilaci-n-de-SUPERWINGS1-EP10_12-_-Superwings-en-Espa-ol-Latino-_-Super-Wings-720P_HD.mp4?rlkey=a61gcy657895m6t90l5ln3bae&raw=1"},
        {t:"Episodios 13 - 15", u:"https://www.dropbox.com/scl/fi/vhqwah8pa4smkcvbcn2zf/Recopilaci-n-de-SUPERWINGS1-EP13_15-_-Superwings-en-Espa-ol-Latino-_-Super-Wings-720P_HD.mp4?rlkey=3syurfp0jsykru6xkqtbz3nd8&raw=1"},
        {t:"Episodios 16 - 18", u:"https://www.dropbox.com/scl/fi/gzv1c47h05qk3c15e7xcm/Recopilaci-n-de-SUPERWINGS1-EP16_18-_-Superwings-en-Espa-ol-Latino-_-Super-Wings-720P_HD.mp4?rlkey=ia539cgwrshz7db2fm5aw8bk8&raw=1"},
        {t:"Episodios 19 - 21", u:"https://www.dropbox.com/scl/fi/7svmx0o7snqdb10zk0ass/Recopilaci-n-de-SUPERWINGS1-EP19_21-_-Superwings-en-Espa-ol-Latino-_-Super-Wings-720P_HD.mp4?rlkey=xolp9ob94rw5rrkrts02ucqyh&raw=1"},
        {t:"Episodios 22 - 24", u:"https://www.dropbox.com/scl/fi/cpf9ls1t26rbc60i1e0na/Recopilaci-n-de-SUPERWINGS1-EP22_24-_-Superwings-en-Espa-ol-Latino-_-Super-Wings-720P_HD.mp4?rlkey=o934n8igkjwu03rch6r8ivixq&raw=1"},
        {t:"Episodios 25 - 27", u:"https://www.dropbox.com/scl/fi/5ftew6oco8yvcs097yw6y/Recopilaci-n-de-SUPERWINGS1-EP25_27-_-Superwings-en-Espa-ol-Latino-_-Super-Wings-720P_HD.mp4?rlkey=d2spji9r131p7ksmpn6ji22cz&raw=1"},
        {t:"Episodios 28 - 30", u:"https://www.dropbox.com/scl/fi/mumq1a5tz7wwp5vtb3698/Recopilaci-n-de-SUPERWINGS1-EP28_30-_-Superwings-en-Espa-ol-Latino-_-Super-Wings-720P_HD.mp4?rlkey=bhjqyokqdwdf3k6psvz71bc2o&raw=1"}
    ];

    const grid = document.getElementById('superwingsGrid');
    const videoContainer = document.getElementById('video-container');
    const titleDisplay = document.getElementById('displayTitle');
    let currentIdx = -1;

    // Función para reproducir video con recarga forzada (Estilo Totoy)
    function playVideo(index) {
        currentIdx = index;
        
        // Crea el reproductor de video dinámicamente
        videoContainer.innerHTML = `
            <video id="mainPlayer" controls playsinline autoplay>
                <source src="${videos[index].u}" type="video/mp4">
            </video>`;
            
        const player = document.getElementById('mainPlayer');
        
        // Lógica de reproducción automática del siguiente episodio
        player.onended = () => { 
            if (currentIdx + 1 < videos.length) {
                playVideo(currentIdx + 1); 
            }
        };
        
        // Actualiza el título amarillo
        titleDisplay.innerText = "Viendo: " + videos[index].t;
        
        // Sube la pantalla suavemente hacia el reproductor
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // Generar la galería de tarjetas dinámicamente al cargar la página
    videos.forEach((v, i) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
            <div class="thumb-placeholder">✈️</div>
            <div class="video-info">${v.t}</div>`;
        
        // Asigna la función de clic para reproducir
        card.onclick = () => playVideo(i);
        grid.appendChild(card);
    });
</script>

</body>
</html>
