<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #fbc02d;
            --bg: #0a0a0c;
            --card-bg: #1c1c21;
            --text: #ffffff;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px 5%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .badge {
            background: var(--accent);
            color: #000;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            vertical-align: middle;
        }

        .player-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        video { width: 100%; height: 100%; object-fit: contain; }

        .video-info { padding: 20px 0; }
        .video-info h2 { margin: 0; font-size: 1.4rem; color: var(--primary); }

        .episodes-section { padding: 0 5% 40px; }
        .section-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
            border-left: 4px solid var(--primary);
            padding-left: 15px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .episode-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .episode-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .episode-card.active { border-color: var(--accent); background: #25252b; }

        .thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(45deg, #1c1c21, #333);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb::after { content: '▶'; font-size: 1.5rem; color: rgba(255,255,255,0.2); }

        .card-body { padding: 10px; }
        .card-body p { margin: 0; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>

    const video = document.getElementById('mainVideo');
    const videoTitle = document.getElementById('videoTitle');
    const grid = document.getElementById('grid');
    let currentIndex = 0;

    function init() {
        playlist.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'episode-card';
            card.id = `card-${index}`;
            card.innerHTML = `
                <div class="thumb"></div>
                <div class="card-body"><p>${item.name}</p></div>
            `;
            card.onclick = () => playVideo(index);
            grid.appendChild(card);
        });
        playVideo(0);
        video.pause();
    }

    function playVideo(index) {
        currentIndex = index;
        const item = playlist[index];
        document.querySelectorAll('.episode-card').forEach(c => c.classList.remove('active'));
        document.getElementById(`card-${index}`).classList.add('active');
        video.src = item.url;
        videoTitle.innerText = item.name;
        video.play();
        if(window.innerWidth < 768) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    video.onended = () => {
        let next = currentIndex + 1;
        if(next < playlist.length) playVideo(next);
        else playVideo(0);
    };

    init();
</script>
