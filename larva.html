<!-- 1. Librería de Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root { 
    --primary: #E50914; 
    --bg: #141414; 
    --card-bg: #1f1f1f; 
    --text: #ffffff; 
    --accent-yellow: #f5c518; 
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
}

header{
    background:#000;
    padding:20px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:var(--primary);
    box-shadow:0 2px 10px rgba(0,0,0,.5);
}

/* HEADER REPRODUCTOR */
.video-box { 
    position: sticky; 
    top: 0; 
    background: #000; 
    z-index: 1000; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.player-wrapper { 
    position: relative; 
    width: 100%; 
    max-width: 900px; 
    margin: 0 auto; 
    background: #000; 
    aspect-ratio: 16/9;
    overflow: hidden;
}

video { 
    width: 100%; 
    height: 100%; 
    display: block; 
    object-fit: contain; 
}

/* CONTROLES ESTILO YOUTUBE/NETFLIX */
.video-overlay-controls {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6); 
    display: flex; 
    justify-content: center; 
    align-items: center;
    gap: 40px; 
    opacity: 0; 
    transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    z-index: 10; 
}

.video-overlay-controls.show { opacity: 1; pointer-events: auto; }

.nav-btn {
    background: rgba(255, 255, 255, 0.1);
    color: white; 
    border: 1px solid rgba(255,255,255,0.2);
    width: 55px; 
    height: 55px;
    border-radius: 50%; 
    font-size: 20px;
    display: flex; 
    align-items: center; 
    justify-content: center;
    cursor: pointer; 
    transition: all 0.2s ease;
}

.play-btn { 
    width: 75px; 
    height: 75px; 
    font-size: 30px; 
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid #fff;
}

.nav-btn:active { transform: scale(0.9); background: var(--primary); }

/* INFO & TITULO */
.player-info { padding: 15px; background: linear-gradient(to bottom, #111, var(--bg)); text-align: left; }
.current-title { 
    color: var(--accent-yellow); 
    font-size: 16px; 
    font-weight: bold; 
    margin-bottom: 10px; 
    display: block;
    border-left: 4px solid var(--primary);
    padding-left: 10px;
}

.back-link{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    background: var(--primary);
    margin: 0;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 12px;
    transition: 0.3s;
}

.back-link:hover{
    background:#b20710;
}

h2{
    font-size: 18px; 
    margin: 20px 15px 10px; 
    text-align: left; 
    color: #ccc;
}

.grid-container{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
    padding:15px;
}

.card{
    background:var(--card-bg);
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 4px 6px rgba(0,0,0,.3);
    position: relative;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px rgba(229,9,20,.4);
}

.card:active { transform: scale(0.95); }

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:10px;
}

.card-title{
    font-size:12px;
    font-weight: 600;
    margin-bottom:0;
    text-align:left;
    color: #ddd;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ANIMACIÓN Y ESTADO DE REPRODUCCIÓN */
.playing-now {
    position: absolute;
    top: 5px;
    left: 5px;
    background: var(--primary);
    color: #fff;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: bold;
    display: none;
    z-index: 5;
}

.card.active .playing-now { display: block; }
.card.active { border: 2px solid var(--primary); }
</style>
</head>

    const videoPlayer = document.getElementById('mainPlayer');
    const titleDisplay = document.getElementById('displayTitle');
    const overlayControls = document.getElementById('overlayControls');
    const centralPlayBtn = document.getElementById('centralPlayBtn');
    let currentIdx = -1;
    let controlsTimer;

    function initGallery() {
        const gallery = document.getElementById('gallery');
        videos.forEach((v, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${i}`;
            card.innerHTML = `
                <div class="playing-now">REPRODUCIENDO</div>
                <img src="${v.img}" alt="${v.t}">
                <div class="card-content">
                    <div class="card-title">${v.t}</div>
                </div>
            `;
            card.onclick = () => playVideo(i);
            gallery.appendChild(card);
        });
    }

    function playVideo(index) {
        if (index < 0) index = videos.length - 1;
        if (index >= videos.length) index = 0;
        
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        const currentCard = document.getElementById(`card-${index}`);
        if(currentCard) {
            currentCard.classList.add('active');
            currentCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
        }

        currentIdx = index;
        videoPlayer.src = videos[index].u;
        videoPlayer.play().catch(err => console.log(err));
        
        videoPlayer.onended = () => playNext();
        centralPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
        titleDisplay.innerText = videos[index].t;
        showControlsTemporarily();
    }

    function togglePlay() {
        if (videoPlayer.paused) {
            videoPlayer.play();
            centralPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
            showControlsTemporarily();
        } else {
            videoPlayer.pause();
            centralPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
            showControlsFixed();
        }
    }

    function playNext() { playVideo(currentIdx + 1); }
    function playPrev() { playVideo(currentIdx - 1); }

    function showControlsTemporarily() {
        clearTimeout(controlsTimer);
        overlayControls.classList.add('show');
        if (!videoPlayer.paused) {
            controlsTimer = setTimeout(() => {
                overlayControls.classList.remove('show');
            }, 3000);
        }
    }

    function showControlsFixed() {
        clearTimeout(controlsTimer);
        overlayControls.classList.add('show');
    }

    videoPlayer.addEventListener('click', (e) => {
        e.preventDefault();
        showControlsTemporarily();
    });

    document.getElementById('playerWrapper').addEventListener('click', (e) => {
        if (e.target.id === 'playerWrapper' || e.target.id === 'overlayControls') {
            showControlsTemporarily();
        }
    });

    window.onload = initGallery;
</script>

</body>
</html>
