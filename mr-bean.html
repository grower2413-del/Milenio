<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mr. Bean TV - PRO ULTRA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #8bc34a; 
            --bg: #050505; 
            --card-bg: #121212; 
            --text: #ffffff; 
            --accent-yellow: #f5c518; 
            --netflix-red: #e50914;
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* HEADER REPRODUCTOR */
        .video-box { 
            position: sticky; 
            top: 0; 
            background: #000; 
            z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .player-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 900px; 
            margin: 0 auto; 
            background: #000; 
            aspect-ratio: 16/9;
            overflow: hidden;
        }
        
        video { width: 100%; height: 100%; display: block; object-fit: contain; }

        /* CONTROLES ESTILO YOUTUBE/NETFLIX */
        .video-overlay-controls {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 40px; 
            opacity: 0; 
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 10; 
        }

        .video-overlay-controls.show { opacity: 1; pointer-events: auto; }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white; 
            border: 1px solid rgba(255,255,255,0.2);
            width: 55px; 
            height: 55px;
            border-radius: 50%; 
            font-size: 20px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            transition: all 0.2s ease;
        }

        .play-btn { 
            width: 75px; 
            height: 75px; 
            font-size: 30px; 
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
        }

        .nav-btn:active { transform: scale(0.9); background: var(--primary); }

        /* INFO & TITULO */
        .player-info { padding: 15px; background: linear-gradient(to bottom, #111, var(--bg)); text-align: left; }
        .current-title { 
            color: var(--accent-yellow); 
            font-size: 16px; 
            font-weight: bold; 
            margin-bottom: 10px; 
            display: block;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }
        
        .btn-atras { 
            background: var(--netflix-red); 
            color: white; 
            padding: 8px 16px; 
            border-radius: 4px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 12px; 
            display: inline-flex; 
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        /* GRID DE EPISODIOS ESTILO APP REAL */
        h2 { font-size: 18px; margin: 20px 15px 10px; text-align: left; color: #ccc; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
            padding: 0 15px 30px; 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 8px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: transform 0.3s ease;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card:hover { transform: translateY(-5px); }
        .card:active { transform: scale(0.95); }

        /* MINIATURA SIMULADA */
        .card-thumb {
            width: 100%;
            height: 100px;
            background: linear-gradient(45deg, #1a1a1a, #333);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-thumb i { font-size: 40px; color: rgba(255,255,255,0.1); }
        
        .card-thumb::after {
            content: 'Mr. Bean';
            position: absolute;
            bottom: 5px;
            right: 8px;
            font-size: 10px;
            color: var(--primary);
            font-weight: bold;
            opacity: 0.6;
        }

        .card-title { 
            padding: 10px; 
            font-size: 11px; 
            font-weight: 600; 
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ddd;
        }

        /* ANIMACIÓN DE CARGA */
        .playing-now {
            position: absolute;
            top: 5px;
            left: 5px;
            background: var(--primary);
            color: #000;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            display: none;
        }

        .card.active .playing-now { display: block; }
        .card.active { border: 2px solid var(--primary); }

    </style>
</head>
<body>

<div class="video-box">

        <video id="mainPlayer" playsinline controls>

        </video>

            <button class="nav-btn" onclick="event.stopPropagation(); playPrev()"><i class="fas fa-backward"></i></button>

            <button class="nav-btn" onclick="event.stopPropagation(); playNext()"><i class="fas fa-forward"></i></button>

    </div>

    <div class="player-info">

    </div>
</div>

    const videoPlayer = document.getElementById('mainPlayer');
    const titleDisplay = document.getElementById('displayTitle');
    const overlayControls = document.getElementById('overlayControls');
    const centralPlayBtn = document.getElementById('centralPlayBtn');
    let currentIdx = -1;
    let controlsTimer;

    // INICIALIZACIÓN
    function initGallery() {
        const gallery = document.getElementById('gallery');
        videos.forEach((v, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${i}`;
            card.innerHTML = `
                <div class="playing-now">REPRODUCIENDO</div>
                <div class="card-thumb">
                    <i class="fas fa-laugh-beam"></i>
                </div>
                <div class="card-title">${v.t}</div>
            `;
            card.onclick = () => playVideo(i);
            gallery.appendChild(card);
        });
    }

    function playVideo(index) {
        if (index < 0) index = videos.length - 1;
        if (index >= videos.length) index = 0;
        
        // Manejo de clase activa
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        const currentCard = document.getElementById(`card-${index}`);
        if(currentCard) {
            currentCard.classList.add('active');
            currentCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
        }

        currentIdx = index;
        videoPlayer.src = videos[index].u;
        videoPlayer.play();
        
        videoPlayer.onended = () => playNext();
        centralPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
        titleDisplay.innerText = videos[index].t;
        showControlsTemporarily();
    }

    function togglePlay() {
        if (videoPlayer.paused) {
            videoPlayer.play();
            centralPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
            showControlsTemporarily();
        } else {
            videoPlayer.pause();
            centralPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
            showControlsFixed();
        }
    }

    function playNext() { playVideo(currentIdx + 1); }
    function playPrev() { playVideo(currentIdx - 1); }

    function showControlsTemporarily() {
        clearTimeout(controlsTimer);
        overlayControls.classList.add('show');
        if (!videoPlayer.paused) {
            controlsTimer = setTimeout(() => {
                overlayControls.classList.remove('show');
            }, 3000);
        }
    }

    function showControlsFixed() {
        clearTimeout(controlsTimer);
        overlayControls.classList.add('show');
    }

    // Eventos de usuario
    videoPlayer.addEventListener('click', (e) => {
        e.preventDefault();
        showControlsTemporarily();
    });

    document.getElementById('playerWrapper').addEventListener('click', (e) => {
        if (e.target.id === 'playerWrapper' || e.target.id === 'overlayControls') {
            showControlsTemporarily();
        }
    });

    // Iniciar galería al cargar
    window.onload = initGallery;
</script>
