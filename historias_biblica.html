    <style>
        :root {
            --netflix-black: #141414;
            --card-bg: #1f1f1f;
            --accent-blue: #007bff;
            --accent-yellow: #f5c518;
            --text-white: #ffffff;
        }

        body {
            background-color: var(--netflix-black);
            color: var(--text-white);
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Contenedor del reproductor fijo */
        .video-box {
            position: sticky;
            top: 0;
            background: #000;
            z-index: 1000;
            border-bottom: 3px solid var(--accent-blue);
            min-height: 50px;
            padding-bottom: 10px;
        }

        #video-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #000;
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            display: block;
        }

        .current-title {
            padding: 10px;
            color: var(--accent-yellow);
            font-size: 14px;
            font-weight: bold;
        }

        .btn-atras {
            background: #e50914;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            font-weight: bold;
            font-size: 13px;
        }

        .lista {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .item {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border: 1px solid #333;
            text-align: left;
        }

        .item:active { background: #007bff; }

        .num {
            color: var(--accent-blue);
            font-size: 18px;
            font-weight: bold;
            margin-right: 15px;
            min-width: 30px;
        }

        .title-text {
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>

        ];

        const listContainer = document.getElementById('bibliaList');
        const videoContainer = document.getElementById('video-container');
        const titleDisplay = document.getElementById('displayTitle');
        let currentIdx = -1;

        function playHistoria(index) {
            currentIdx = index;
            
            // Destruye y crea el reproductor para evitar el error del video roto
            videoContainer.innerHTML = `
                <video id="mainPlayer" controls playsinline autoplay>
                    <source src="${historias[index].u}" type="video/mp4">
                </video>
            `;

            const player = document.getElementById('mainPlayer');
            
            // Al terminar el video, pasar al siguiente automáticamente
            player.onended = () => {
                if (currentIdx + 1 < historias.length) playHistoria(currentIdx + 1);
            };

            titleDisplay.innerText = "Reproduciendo: " + historias[index].t;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // Generar la lista en pantalla
        historias.forEach((historia, i) => {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `<span class="num">${i+1}</span><span class="title-text">${historia.t}</span>`;
            item.onclick = () => playHistoria(i);
            listContainer.appendChild(item);
        });
    </script>

</html>
